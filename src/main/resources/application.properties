spring.application.name=taskflow-api
# ==========================
# CONFIGURAÇÃO DO BANCO
# ==========================

spring.datasource.url=jdbc:postgresql://localhost:5432/taskflow_db
spring.datasource.username=taskflow_user
spring.datasource.password=taskflow_password

# Driver JDBC responsável pela comunicação entre Java e PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# CONFIGURAÇÃO DO HIBERNATE
# ==========================

# Atualiza automaticamente as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Exibe o SQL executado no console
spring.jpa.show-sql=true

# Formata o SQL para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do banco PostgreSQL (gere o SQL compatível com o PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect